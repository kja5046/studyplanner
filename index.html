<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>스터디 플래너</title>
  <meta name="theme-color" content="#f4f2ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="플래너">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-daily" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-monthly" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 13h2M14 13h2M8 16.5h2"/></symbol>
      <symbol id="i-review" viewBox="0 0 24 24"><path d="M12 3.8l2.4 5 5.4.6-4 3.7 1.1 5.4L12 15.8l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></symbol>
      <symbol id="i-subjects" viewBox="0 0 24 24"><path d="M4 6l1.6 1.6L8.5 4.5M4 12.5l1.6 1.6L8.5 11M11.5 6.5H20M11.5 13H20M11.5 19H20M4.5 19h3"/></symbol>
      <symbol id="i-lectures" viewBox="0 0 24 24"><path d="M3 5.5h18v11H3zM8.5 20h7M12 16.5V20"/><path d="M10.5 8.5v5l4-2.5z"/></symbol>
      <symbol id="i-exams" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.2L12 4.5l8 6.7M6.5 9.5V19.5h11V9.5"/><path d="M10 19.5v-5h4v5"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13 7l4 4"/></symbol>
      <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 14.5l7.5-9.5 3 2.5-7.5 9.5z"/><path d="M9 14.5l-2.5 3.5h4l1.5-1.5M4 21h16"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.5 19.5L4 15l9.5-9.5 6.5 6.5-8 7.5zM9 10l6.5 6.5M8.5 19.5H20"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16"/><path d="M4.5 11.5H15a4.5 4.5 0 010 9h-3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 013 0V12M11 11V5a1.5 1.5 0 013 0v6M14 11V6.5a1.5 1.5 0 013 0V14c0 3.6-2.4 6.5-6 6.5-2.4 0-3.8-1-5-2.8L4 14.6a1.5 1.5 0 012.5-1.6L8 15"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.6-7.5-10A4 4 0 0112 7a4 4 0 017.5 2.5c0 5.4-7.5 10-7.5 10z"/></symbol>
      <symbol id="i-inf" viewBox="0 0 24 24"><path d="M12 12c-2-2.6-3.6-3.8-5.4-3.8a3.8 3.8 0 000 7.6C8.4 15.8 10 14.6 12 12zm0 0c2 2.6 3.6 3.8 5.4 3.8a3.8 3.8 0 000-7.6C15.6 8.2 14 9.4 12 12z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.8c1.7 1.4 3 3 4.1 5.2C11 12.3 14.6 7.6 19.8 4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17.5l4.5-4.5 3.5 3.5 2.5-2.5 3.5 3.5"/></symbol>
    </defs>
  </svg>
</head>
<body>
  <header class="topnav">
    <nav class="tabs" id="tabs">
      <a href="#/daily" data-tab="daily"><svg><use href="#i-daily"/></svg><span>하루 기록</span></a>
      <a href="#/monthly" data-tab="monthly"><svg><use href="#i-monthly"/></svg><span>월간 계획</span></a>
      <a href="#/review" data-tab="review"><svg><use href="#i-review"/></svg><span>이달의 평가</span></a>
      <a href="#/subjects" data-tab="subjects"><svg><use href="#i-subjects"/></svg><span>과목별 계획</span></a>
      <a href="#/lectures" data-tab="lectures"><svg><use href="#i-lectures"/></svg><span>온라인 강의</span></a>
      <a href="#/exams" data-tab="exams"><svg><use href="#i-exams"/></svg><span>시험 결과</span></a>
      <a href="#/settings" data-tab="settings"><svg><use href="#i-settings"/></svg><span>설정</span></a>
    </nav>
  </header>

  <main id="stage">
    <div class="layout">
      <div class="page-wrap" id="pageWrap">
        <div class="page" id="page">
          <div class="frame">
            <div id="pageContent"></div>
          </div>
          <canvas id="ink" class="ink"></canvas>
        </div>
      </div>

      <aside class="rail" id="rail">
        <a class="rtab" id="railHome" href="#/daily" title="오늘"><svg><use href="#i-home"/></svg></a>
        <button class="rtab pink" id="penToggle" title="필기 모드"><svg><use href="#i-pen"/></svg></button>
        <div class="rail-tools" id="penSub" hidden>
          <div class="swatches" id="swatches"></div>
          <button class="rtab tool active" data-tool="pen" title="펜"><svg><use href="#i-pen"/></svg></button>
          <button class="rtab tool" data-tool="hl" title="형광펜"><svg><use href="#i-hl"/></svg></button>
          <button class="rtab tool" data-tool="eraser" title="지우개"><svg><use href="#i-eraser"/></svg></button>
          <div class="widths" id="penWidth">
            <button data-w="1.5" title="가늘게"><i style="width:4px;height:4px"></i></button>
            <button data-w="2.5" class="active" title="보통"><i style="width:7px;height:7px"></i></button>
            <button data-w="4" title="굵게"><i style="width:10px;height:10px"></i></button>
          </div>
          <button class="rtab" id="penUndo" title="실행취소"><svg><use href="#i-undo"/></svg></button>
          <button class="rtab" id="penClear" title="이 페이지 필기 모두 지우기"><svg><use href="#i-trash"/></svg></button>
          <button class="rtab" id="penOnlyBtn" title="펜슬만 인식 (손가락은 스크롤)"><svg><use href="#i-hand"/></svg></button>
        </div>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=3"></script>
</body>
</html>
